# Preferred/primary sources per research area (added 2026-08-23, per
# explicit instruction). Check these FIRST -- they're purpose-built and
# typically faster and more authoritative than waiting for general news
# coverage of the same event.

ipo:
  primary: "Chittorgarh.com"
  urls:
    - "https://www.chittorgarh.com/report/upcoming-ipos-drhp-filed/158/all/"
    - "https://www.chittorgarh.com/ipo/ipo_dashboard.asp"
