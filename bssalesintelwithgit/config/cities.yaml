# Target cities for the Business Standard Sales Intelligence Agent
#
# "primary_sales_territory" companies feed the qualified Bangalore opportunity
# list. Everything else is market intelligence only — NEVER auto-promoted into
# the Bangalore qualified list regardless of how strong the trigger is.

primary_sales_territory:
  city: "Bangalore"
  aliases: ["Bengaluru", "Bangalore Urban", "Bangalore, Karnataka"]
  qualification_rule: >
    A company qualifies for the Bangalore regional opportunity list ONLY if
    its registered/corporate HEADQUARTERS is in Bangalore, verified per the
    hq-verification skill. Campaign geography, office presence, founder
    residence, or employee headcount in Bangalore do NOT qualify a company.
  hq_statuses:
    - BANGALORE_HQ_VERIFIED   # eligible for the qualified list
    - NON_BANGALORE_HQ_VERIFIED
    - HQ_UNVERIFIED           # goes to HQ_VERIFICATION_QUEUE, never assumed

market_research_cities:
  - city: "Chennai"
    aliases: ["Chennai, Tamil Nadu"]
    role: "market_intelligence_only"
  - city: "Hyderabad"
    aliases: ["Hyderabad, Telangana", "Secunderabad"]
    role: "market_intelligence_only"

notes: >
  Chennai/Hyderabad-HQ companies are tracked in the companies table with
  hq_city set accordingly and NEVER appear in reports section "BANGALORE-HQ
  COMPANIES WITH NEW BUSINESS TRIGGERS" or any qualified-opportunity list.
  They surface only in explicit market-research queries.
